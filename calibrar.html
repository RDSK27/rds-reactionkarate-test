<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>RDS Karate — Calibrar dianas</title>
<style>
  :root{ --rojo:#A23A29; --rojo2:#b03020; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:Arial,Helvetica,sans-serif;background:#c9cdd1;color:#111;padding-bottom:96px;}
  header{background:#000;color:#fff;border-bottom:4px solid var(--rojo2);padding:10px 14px;position:sticky;top:0;z-index:20;}
  header b{letter-spacing:.1em;text-transform:uppercase;font-size:.95rem;}
  header p{color:#cfcfcf;font-size:.66rem;margin-top:3px;line-height:1.4;}
  .grouphdr{background:var(--rojo);color:#fff;font-weight:900;letter-spacing:.08em;text-transform:uppercase;
    font-size:.72rem;padding:8px 14px;margin-top:8px;}
  .card{background:#fff;margin:8px;border:1px solid #bbb;border-radius:6px;padding:8px 8px 10px;
    display:flex;gap:10px;align-items:flex-start;}
  .name{font-weight:900;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;min-width:96px;}
  .readout{font-family:monospace;font-size:.72rem;color:#555;margin-top:4px;}
  .stage{position:relative;background:linear-gradient(180deg,#f3eee3,#e6ddc9);border:2px solid #111;
    flex:0 0 auto;touch-action:none;overflow:hidden;}
  .stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;}
  .handle{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;
    border:3px dashed var(--rojo);background:rgba(162,58,41,.12);cursor:grab;touch-action:none;
    display:flex;align-items:center;justify-content:center;}
  .handle::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--rojo);}
  .handle:active{cursor:grabbing;}
  footer{position:fixed;left:0;right:0;bottom:0;background:#000;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    display:flex;gap:8px;align-items:center;z-index:20;border-top:4px solid var(--rojo2);}
  footer button{background:var(--rojo);color:#fff;border:0;border-radius:4px;font-weight:900;letter-spacing:.08em;
    text-transform:uppercase;font-size:.78rem;padding:11px 14px;cursor:pointer;}
  footer button.sec{background:#333;}
  #out{flex:1;min-width:0;background:#111;color:#7CFC9A;font-family:monospace;font-size:.62rem;
    border:1px solid #444;border-radius:4px;padding:8px;height:52px;resize:none;}
  .tip{font-size:.62rem;color:#777;padding:2px 14px 0;}
</style>
</head>
<body>
<header>
  <b>Calibrar dianas</b>
  <p>Arrastra el aro de cada imagen al sitio exacto que hay que tocar. En los ataques: el puño o el pie que golpea. En guardias/defensas: la zona abierta que hay que atacar. Luego pulsa EXPORTAR y me pegas el texto.</p>
</header>
<div id="list"></div>
<p class="tip" id="progress"></p>
<footer>
  <button onclick="exportAll()">Exportar</button>
  <button class="sec" onclick="copyOut()">Copiar</button>
  <textarea id="out" readonly placeholder="aquí saldrá el texto a copiar"></textarea>
</footer>

<script>
var STAGE_H = 300;
var GROUPS = [
  { title:'Ataques — toca el puño / el pie que golpea', items:[
    'atk_jab','atk_cross','atk_combo','atk_elbow','kick_front','kick_mid','kick_high','knee',
    'kick_low','sweep_low' ] },
  { title:'Guardias y defensas — toca la zona abierta a atacar (Modo Ataque)', items:[
    'guard_base','guard_closed','guard_chest','guard_flank','guard_temple','guard_low',
    'block_side','block_high','block_cross','block_low','cover','evade_back' ] }
];
var DEFAULTS = {
  atk_jab:[0.78,0.20], atk_cross:[0.85,0.22], atk_combo:[0.30,0.18], atk_elbow:[0.30,0.22],
  kick_front:[0.72,0.20], kick_mid:[0.72,0.34], kick_high:[0.30,0.10], knee:[0.42,0.44],
  kick_low:[0.20,0.62], sweep_low:[0.15,0.82]
};
var LSKEY = 'rds_karate_dianas_v2';
var saved = {};
try { saved = JSON.parse(localStorage.getItem(LSKEY) || '{}'); } catch(e){}

var MANIFEST = [{"name":"guard_base","w":168,"h":332},{"name":"atk_jab","w":168,"h":334},{"name":"atk_cross","w":185,"h":334},{"name":"atk_combo","w":179,"h":332},{"name":"atk_elbow","w":181,"h":349},{"name":"kick_front","w":168,"h":353},{"name":"kick_mid","w":170,"h":348},{"name":"kick_high","w":179,"h":354},{"name":"knee","w":140,"h":340},{"name":"kick_low","w":276,"h":348},{"name":"sweep_low","w":359,"h":259},{"name":"guard_closed","w":168,"h":333},{"name":"guard_chest","w":167,"h":335},{"name":"guard_flank","w":179,"h":334},{"name":"guard_temple","w":179,"h":333},{"name":"block_side","w":180,"h":349},{"name":"guard_low","w":178,"h":340},{"name":"block_high","w":179,"h":351},{"name":"block_cross","w":176,"h":348},{"name":"block_low","w":125,"h":340},{"name":"cover","w":157,"h":345},{"name":"evade_back","w":186,"h":243}];
var META = {};
var pts = {};
MANIFEST.forEach(function(s){ META[s.name] = s; });
build();

function build(){
  var list = document.getElementById('list');
  GROUPS.forEach(function(g){
    var h = document.createElement('div'); h.className='grouphdr'; h.textContent=g.title; list.appendChild(h);
    g.items.forEach(function(name){
      var meta = META[name]; if(!meta) return;
      var p = saved[name] || DEFAULTS[name] || [0.5,0.5];
      pts[name] = [p[0], p[1]];

      var card = document.createElement('div'); card.className='card';
      var col = document.createElement('div');
      var nm = document.createElement('div'); nm.className='name'; nm.textContent=name;
      var ro = document.createElement('div'); ro.className='readout'; ro.id='ro_'+name;
      col.appendChild(nm); col.appendChild(ro);

      var w = STAGE_H * (meta.w/meta.h);
      var stage = document.createElement('div'); stage.className='stage';
      stage.style.width = w+'px'; stage.style.height = STAGE_H+'px';
      var img = document.createElement('img'); img.src = 'assets/'+name+'.png';
      var handle = document.createElement('div'); handle.className='handle';
      stage.appendChild(img); stage.appendChild(handle);

      card.appendChild(col); card.appendChild(stage);
      list.appendChild(card);

      function place(){
        handle.style.left = (pts[name][0]*100)+'%';
        handle.style.top  = (pts[name][1]*100)+'%';
        ro.textContent = 'hx '+pts[name][0].toFixed(3)+'   hy '+pts[name][1].toFixed(3);
      }
      place();

      var dragging=false;
      function fromEvent(ev){
        var r = stage.getBoundingClientRect();
        var x = (ev.clientX - r.left) / r.width;
        var y = (ev.clientY - r.top) / r.height;
        pts[name][0] = Math.max(0, Math.min(1, x));
        pts[name][1] = Math.max(0, Math.min(1, y));
        place();
      }
      handle.addEventListener('pointerdown', function(ev){ dragging=true; handle.setPointerCapture(ev.pointerId); ev.preventDefault(); });
      handle.addEventListener('pointermove', function(ev){ if(dragging){ fromEvent(ev); } });
      handle.addEventListener('pointerup', function(ev){ dragging=false; persist(); });
      stage.addEventListener('pointerdown', function(ev){ if(ev.target===stage||ev.target===img){ fromEvent(ev); persist(); } });
    });
  });
  updProgress();
}

function persist(){
  try { localStorage.setItem(LSKEY, JSON.stringify(pts)); } catch(e){}
  updProgress();
}
function updProgress(){
  var moved = 0, total = 0;
  Object.keys(pts).forEach(function(k){
    total++;
    var d = DEFAULTS[k] || [0.5,0.5];
    if(Math.abs(pts[k][0]-d[0])>0.001 || Math.abs(pts[k][1]-d[1])>0.001 || saved[k]) moved++;
  });
  document.getElementById('progress').textContent = 'Ajustadas: '+moved+' / '+total+' (se guardan solas al soltar)';
}
function exportAll(){
  var o = {};
  Object.keys(pts).forEach(function(k){ o[k] = [ +pts[k][0].toFixed(3), +pts[k][1].toFixed(3) ]; });
  document.getElementById('out').value = JSON.stringify(o);
}
function copyOut(){
  var t = document.getElementById('out');
  if(!t.value) exportAll();
  t.select();
  try { navigator.clipboard.writeText(t.value); } catch(e){ document.execCommand('copy'); }
}
</script>
</body>
</html>
